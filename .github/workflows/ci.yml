name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python package (dev + web API deps)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,web]"
      - name: Verify web extras (supabase, jwt)
        run: |
          python -c "import jwt, supabase; from foresight_x.ui import api_server; print('imports ok')"
      - name: Chaos demo (resilience judge artifacts)
        run: make chaos-demo
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        working-directory: web
        run: npm ci && npm run build
