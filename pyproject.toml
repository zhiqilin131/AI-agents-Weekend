[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foresight-x"
version = "0.1.0"
description = "Evidence-grounded decision agent (Foresight-X)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.2,<3",
    "llama-index>=0.10,<0.13",
    "llama-index-vector-stores-chroma>=0.1,<0.5",
    "llama-index-llms-openai>=0.1,<0.6",
    "llama-index-embeddings-openai>=0.1,<0.6",
    "chromadb>=0.5,<1",
    "tavily-python>=0.4,<0.7",
    "icalendar>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "python-dotenv>=1,<2",
]
web = [
    "fastapi>=0.115.8,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "faster-whisper>=1.1,<2",
    "openai>=1.55,<2",
    # api_server → auth (JWT verification); import runs even when auth is optional at runtime
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
]
decision = [
    "ortools>=9.10,<10",
    "pymcdm>=1.3,<2",
]
deploy = [
    "supabase>=2.4,<3",
    "redis[hiredis]>=5.0,<6",
    "sentry-sdk[fastapi]>=2.0,<3",
    "slowapi>=0.1.9,<1",
    "orjson>=3.10,<4",
    "pyjwt[crypto]>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["foresight_x"]

[tool.hatch.build.targets.wheel.force-include]
"foresight_x/retrieval/seeds" = "foresight_x/retrieval/seeds"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
